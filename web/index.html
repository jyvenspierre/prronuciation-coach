<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronunciation Coach</title><style>
body{font-family:system-ui,sans-serif;background:#f4f6fb;color:#182238;margin:0;padding:24px}main{max-width:720px;margin:auto;background:white;border-radius:20px;padding:28px;box-shadow:0 6px 24px #0001}button,select{font:inherit;padding:12px;border-radius:10px;margin:6px;cursor:pointer}button{background:#183b76;color:white;border:0}button:disabled{opacity:.5}.words{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.word{background:#eef3fb;color:#172d4b;display:flex;flex-direction:column;align-items:center;gap:5px}.word small{font-size:14px}.active{outline:3px solid #4b83de}.hint{color:#526079}#feedback{min-height:3em}
</style></head><body><main><h1>Pronunciation Coach</h1><p class="hint">Practice a word, then use it in a sentence. Tap any word to see its IPA.</p>
<label>Focus <select id="skill"><option value="stress">Word stress</option><option value="th">TH sound</option><option value="r">R sound</option><option value="vowels">Vowels</option></select></label>
<h2 id="target"></h2><p id="stress"></p><button id="speak">Hear word</button><button id="slow">Slow word</button>
<h3>Sentence practice</h3><div class="words" id="words"></div><p id="detail" aria-live="polite"></p><button id="sentence">Hear sentence</button>
<div><button id="record">Record practice</button><button id="stop" disabled>Stop recording</button><button id="play" disabled>Play my recording</button></div><audio id="audio" controls hidden></audio><p id="feedback" aria-live="polite">Recording is for self-review; automated pronunciation scoring is not yet available.</p><button id="next">Next word →</button>
</main><script>
const lessons={
stress:[{word:"testimony",ipa:"/ˈtɛstəˌmoʊni/",stress:"TEST-i-mo-ny",tokens:[["I","/aɪ/"],["have","/hæv/"],["a","/ə/"],["testimony","/ˈtɛstəˌmoʊni/"],["to","/tə/"],["share","/ʃɛr/"]]},
{word:"photography",ipa:"/fəˈtɑɡrəfi/",stress:"pho-TOG-ra-phy",tokens:[["I’m","/aɪm/"],["interested","/ˈɪntrəstɪd/"],["in","/ɪn/"],["photography","/fəˈtɑɡrəfi/"]]}],
th:[{word:"think",ipa:"/θɪŋk/",stress:"THINK",tokens:[["I","/aɪ/"],["think","/θɪŋk/"],["this","/ðɪs/"],["will","/wɪl/"],["help","/hɛlp/"]]}],
r:[{word:"really",ipa:"/ˈriəli/",stress:"REAL-ly",tokens:[["I","/aɪ/"],["really","/ˈriəli/"],["like","/laɪk/"],["reading","/ˈridɪŋ/"]]}],
vowels:[{word:"sheep",ipa:"/ʃip/",stress:"SHEEP",tokens:[["The","/ðə/"],["sheep","/ʃip/"],["is","/ɪz/"],["sleeping","/ˈslipɪŋ/"]]}]};
let idx=0,recorder,chunks=[],audioURL;
const el=id=>document.getElementById(id);
function lesson(){return lessons[el("skill").value][idx%lessons[el("skill").value].length]}
function render(){let l=lesson();el("target").textContent=l.word+" "+l.ipa;el("stress").textContent="Stress: "+l.stress;el("words").replaceChildren();l.tokens.forEach(([w,ipa])=>{let b=document.createElement("button");b.className="word";let s=document.createElement("strong");s.textContent=w;let small=document.createElement("small");small.textContent=ipa;b.append(s,small);b.onclick=()=>{document.querySelectorAll(".word").forEach(x=>x.classList.remove("active"));b.classList.add("active");el("detail").textContent=w+" — "+ipa;say(w)};el("words").append(b)});el("detail").textContent="Tap a word to hear it.";el("feedback").textContent="Recording is for self-review; automated pronunciation scoring is not yet available."}
function say(text,rate=0.9){if(!("speechSynthesis" in window)){el("feedback").textContent="Speech playback is unavailable in this browser.";return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==="en-US")||null;speechSynthesis.speak(u)}
el("speak").onclick=()=>say(lesson().word);el("slow").onclick=()=>say(lesson().word,0.65);el("sentence").onclick=()=>say(lesson().tokens.map(t=>t[0]).join(" "));el("next").onclick=()=>{idx++;render()};el("skill").onchange=()=>{idx=0;render()};
el("record").onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){el("feedback").textContent="Recording requires a supported browser and HTTPS (or localhost).";return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));el("audio").src=audioURL;el("play").disabled=false;stream.getTracks().forEach(t=>t.stop());el("feedback").textContent="Listen to your recording and compare it with the example. No score has been calculated."};recorder.start();el("record").disabled=true;el("stop").disabled=false;el("feedback").textContent="Recording…"}catch(e){el("feedback").textContent="Microphone permission denied or unavailable."}};
el("stop").onclick=()=>{if(recorder?.state==="recording")recorder.stop();el("record").disabled=false;el("stop").disabled=true};el("play").onclick=()=>{el("audio").hidden=false;el("audio").play()};render();
</script></body></html>
